name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ef
          POSTGRES_PASSWORD: ef
          POSTGRES_DB: eventflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ef" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ef:ef@localhost:5432/eventflow_ci
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@ci.test
      ADMIN_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # db:setup lee .env.local; en CI las variables vienen del entorno.
      - run: touch .env.local
      - run: npm run db:setup
      - run: npm test
      - run: npm run build
